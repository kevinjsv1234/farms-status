<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Farmeo</title>
<style>
  :root {
    --bg: #0f1420;
    --bg-card: #1a2233;
    --bg-card-2: #212b40;
    --texto: #eef1f8;
    --texto-tenue: #9aa5bd;
    --borde: #2b3550;
    --acento: #5b8cff;
    --acento-2: #7aa2ff;
    --verde: #34d399;
    --rojo: #f87171;
    --amarillo: #fbbf24;
    --radio: 14px;
    --sombra: 0 4px 18px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2740 0%, var(--bg) 55%);
    color: var(--texto);
    min-height: 100vh;
  }

  .oculto { display: none !important; }

  /* ---------- LOGIN ---------- */
  #pantalla-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card-login {
    width: 100%;
    max-width: 360px;
    background: var(--bg-card);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 32px 28px;
    text-align: center;
  }

  .card-login h1 {
    font-size: 1.3rem;
    margin: 0 0 6px;
  }

  .card-login p.sub {
    color: var(--texto-tenue);
    font-size: .88rem;
    margin: 0 0 22px;
  }

  input#input-codigo {
    width: 100%;
    font-size: 1.6rem;
    letter-spacing: .5rem;
    text-align: center;
    padding: 12px 8px;
    border-radius: 10px;
    border: 1px solid var(--borde);
    background: var(--bg-card-2);
    color: var(--texto);
    outline: none;
  }
  input#input-codigo:focus {
    border-color: var(--acento);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .08s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .btn-primario { background: var(--acento); color: white; }
  .btn-primario:hover:not(:disabled) { background: var(--acento-2); }

  .btn-block { width: 100%; margin-top: 16px; }

  .error-msg {
    color: var(--rojo);
    font-size: .85rem;
    min-height: 1.2em;
    margin-top: 12px;
  }

  /* ---------- DASHBOARD ---------- */
  #pantalla-dashboard {
    max-width: 980px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  header.top h1 {
    font-size: 1.15rem;
    margin: 0;
  }
  header.top .propietario {
    color: var(--acento-2);
  }

  .acciones-top {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn-secundario {
    background: var(--bg-card-2);
    color: var(--texto);
    border: 1px solid var(--borde);
  }
  .btn-secundario:hover:not(:disabled) { border-color: var(--acento); }

  .btn-sm { padding: 8px 12px; font-size: .8rem; }

  .ultima-actualizacion {
    font-size: .75rem;
    color: var(--texto-tenue);
    text-align: right;
    margin-bottom: 14px;
  }

  /* Totales globales */
  .totales-globales {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }
  @media (min-width: 560px) {
    .totales-globales { grid-template-columns: repeat(4, 1fr); }
  }

  .stat-tile {
    background: var(--bg-card);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 14px;
  }
  .stat-tile .valor {
    font-size: 1.25rem;
    font-weight: 700;
  }
  .stat-tile .etiqueta {
    font-size: .72rem;
    color: var(--texto-tenue);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-top: 2px;
  }

  .resumen-estado {
    display: flex;
    gap: 10px;
    font-size: .8rem;
    color: var(--texto-tenue);
    margin: -14px 0 22px;
    flex-wrap: wrap;
  }
  .resumen-estado b { color: var(--texto); }

  /* Grupos por cuenta */
  .grupo-cuenta {
    background: var(--bg-card);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .grupo-cuenta .cabecera {
    padding: 12px 16px;
    background: var(--bg-card-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .grupo-cuenta .cabecera .email {
    font-weight: 600;
    font-size: .88rem;
    word-break: break-all;
  }

  .subtotales {
    display: flex;
    gap: 12px;
    font-size: .75rem;
    color: var(--texto-tenue);
    flex-wrap: wrap;
  }
  .subtotales span b { color: var(--texto); }

  .lista-perfiles { padding: 6px; }

  .perfil-card {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 14px;
    border-radius: 10px;
    margin: 6px;
  }
  .perfil-card:hover { background: rgba(255,255,255,.02); }

  @media (min-width: 700px) {
    .perfil-card {
      grid-template-columns: 1.4fr 1.4fr 1fr auto;
      align-items: center;
    }
  }

  .perfil-id {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .perfil-id .nombre { font-weight: 700; font-size: .95rem; }
  .perfil-id .meta { font-size: .72rem; color: var(--texto-tenue); }

  .recursos {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: .78rem;
  }
  .recursos .chip {
    background: var(--bg-card-2);
    border-radius: 8px;
    padding: 4px 8px;
    white-space: nowrap;
  }

  .tiempos {
    font-size: .75rem;
    color: var(--texto-tenue);
    line-height: 1.5;
  }
  .tiempos .regreso-ok { color: var(--verde); }
  .tiempos .regreso-listo { color: var(--amarillo); font-weight: 600; }

  .acciones-perfil {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-start;
  }
  @media (min-width: 700px) {
    .acciones-perfil { justify-content: flex-end; }
  }

  .badge {
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-activo { background: rgba(52,211,153,.15); color: var(--verde); }
  .badge-pausado { background: rgba(248,113,113,.15); color: var(--rojo); }
  .badge-pendiente { background: rgba(251,191,36,.15); color: var(--amarillo); }

  .btn-pausar { background: rgba(248,113,113,.15); color: var(--rojo); }
  .btn-pausar:hover:not(:disabled) { background: rgba(248,113,113,.28); }
  .btn-reanudar { background: rgba(52,211,153,.15); color: var(--verde); }
  .btn-reanudar:hover:not(:disabled) { background: rgba(52,211,153,.28); }
  .btn-pendiente { background: rgba(251,191,36,.15); color: var(--amarillo); }

  .vacio {
    text-align: center;
    color: var(--texto-tenue);
    padding: 40px 10px;
    font-size: .9rem;
  }

  footer.creditos {
    text-align: center;
    color: var(--texto-tenue);
    font-size: .72rem;
    margin-top: 30px;
  }
</style>
</head>
<body>

<section id="pantalla-login">
  <div class="card-login">
    <h1>🌾 Panel de Farmeo</h1>
    <p class="sub">Ingresa tu código de 6 dígitos para ver tus granjas</p>
    <input id="input-codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••">
    <button class="btn btn-primario btn-block" id="btn-entrar">Entrar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</section>

<section id="pantalla-dashboard" class="oculto">
  <header class="top">
    <h1>🌾 Hola, <span class="propietario" id="txt-propietario"></span></h1>
    <div class="acciones-top">
      <button class="btn btn-secundario btn-sm" id="btn-actualizar">🔄 Actualizar</button>
      <button class="btn btn-secundario btn-sm" id="btn-salir">Salir</button>
    </div>
  </header>

  <div class="ultima-actualizacion" id="txt-ultima-actualizacion"></div>

  <div class="totales-globales" id="totales-globales"></div>
  <div class="resumen-estado" id="resumen-estado"></div>

  <div id="contenedor-cuentas"></div>
</section>

<footer class="creditos">Panel interno de farmeo — los cambios pueden tardar unos minutos en aplicarse.</footer>

<script>
(function () {
  "use strict";

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfnMSLDHqq_NVr67XhG42kLXWlTi9wfiNXiMAM7IkjTHV8cfc7AlSByvK6Dh_Owf2b/exec";
  const INTERVALO_REFRESH_MS = 45000;   // vuelve a pedir datos al servidor
  const INTERVALO_TICK_MS = 20000;      // solo recalcula los contadores de tiempo

  const estadoApp = {
    propietario: null,
    codigo: null,
    perfiles: [],
  };

  let timerRefresh = null;
  let timerTick = null;

  // ---------- helpers de red ----------

  function postAppsScript(payload) {
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    }).then(r => r.json());
  }

  function getAppsScript(params) {
    const qs = new URLSearchParams(params).toString();
    return fetch(`${APPS_SCRIPT_URL}?${qs}`).then(r => r.json());
  }

  // ---------- fechas / tiempos ----------

  function parseFechaCustom(str) {
    if (!str) return null;
    const partes = String(str).trim().split(" ");
    if (partes.length !== 2) return null;
    const [hhmm, ddmmyyyy] = partes;
    const [hh, mm] = hhmm.split(":").map(Number);
    const [dd, MM, yyyy] = ddmmyyyy.split("/").map(Number);
    if ([hh, mm, dd, MM, yyyy].some(Number.isNaN)) return null;
    return new Date(yyyy, MM - 1, dd, hh, mm);
  }

  function calcularRegreso(perfil) {
    const ultimo = parseFechaCustom(perfil.ultimo_farmer);
    const horas = parseFloat(perfil.tiempo_retorno);
    if (!ultimo || Number.isNaN(horas)) return null;
    return new Date(ultimo.getTime() + horas * 3600 * 1000);
  }

  function dosDigitos(n) { return String(n).padStart(2, "0"); }

  function textoRegreso(perfil) {
    if (!perfil.ultimo_farmer) return { texto: "Aún no ha farmeado", clase: "" };
    const regreso = calcularRegreso(perfil);
    if (!regreso) return { texto: "Sin datos de retorno", clase: "" };
    const ahora = new Date();
    const diffMin = Math.round((regreso - ahora) / 60000);
    const hhmm = `${dosDigitos(regreso.getHours())}:${dosDigitos(regreso.getMinutes())}`;
    if (diffMin > 0) {
      return { texto: `En marcha — vuelve ${hhmm} (en ${diffMin} min)`, clase: "regreso-ok" };
    }
    return { texto: `Lista para farmear (volvió hace ${Math.abs(diffMin)} min)`, clase: "regreso-listo" };
  }

  function numero(v, decimales = 1) {
    const n = parseFloat(v);
    return Number.isFinite(n) ? n : 0;
  }

  function formatoNumero(n) {
    return n.toLocaleString("es-PE", { maximumFractionDigits: 1 });
  }

  // ---------- estados de perfil ----------

  const ESTADOS = {
    activo:              { label: "Activo",      badge: "badge-activo",    boton: "Pausar",      claseBtn: "btn-pausar",   accion: "pausar",   habilitado: true },
    pausar_solicitado:   { label: "Pausando…",    badge: "badge-pendiente", boton: "Pausando…",   claseBtn: "btn-pendiente", accion: null,      habilitado: false },
    pausado:             { label: "Pausado",      badge: "badge-pausado",   boton: "Reanudar",    claseBtn: "btn-reanudar", accion: "reanudar", habilitado: true },
    reanudar_solicitado: { label: "Reanudando…",  badge: "badge-pendiente", boton: "Reanudando…", claseBtn: "btn-pendiente", accion: null,      habilitado: false },
  };

  function infoEstado(estado) {
    return ESTADOS[estado] || ESTADOS.activo;
  }

  // ---------- login ----------

  const inputCodigo = document.getElementById("input-codigo");
  const btnEntrar = document.getElementById("btn-entrar");
  const loginError = document.getElementById("login-error");

  function intentarLogin(codigo) {
    loginError.textContent = "";
    btnEntrar.disabled = true;
    btnEntrar.textContent = "Verificando…";

    return postAppsScript({ action: "login", codigo })
      .then(resp => {
        if (!resp.ok) {
          loginError.textContent = resp.error || "Código incorrecto";
          return false;
        }
        estadoApp.propietario = resp.propietario;
        estadoApp.codigo = codigo;
        estadoApp.perfiles = resp.perfiles || [];
        sessionStorage.setItem("farmeo_codigo", codigo);
        mostrarDashboard();
        return true;
      })
      .catch(() => {
        loginError.textContent = "No se pudo conectar. Revisa tu internet e intenta de nuevo.";
        return false;
      })
      .finally(() => {
        btnEntrar.disabled = false;
        btnEntrar.textContent = "Entrar";
      });
  }

  btnEntrar.addEventListener("click", () => {
    const codigo = inputCodigo.value.trim();
    if (codigo.length !== 6) {
      loginError.textContent = "El código debe tener 6 dígitos";
      return;
    }
    intentarLogin(codigo);
  });

  inputCodigo.addEventListener("keydown", e => {
    if (e.key === "Enter") btnEntrar.click();
  });
  inputCodigo.addEventListener("input", () => {
    inputCodigo.value = inputCodigo.value.replace(/[^0-9]/g, "");
  });

  document.getElementById("btn-salir").addEventListener("click", () => {
    sessionStorage.removeItem("farmeo_codigo");
    estadoApp.propietario = null;
    estadoApp.codigo = null;
    estadoApp.perfiles = [];
    clearInterval(timerRefresh);
    clearInterval(timerTick);
    document.getElementById("pantalla-dashboard").classList.add("oculto");
    document.getElementById("pantalla-login").classList.remove("oculto");
    inputCodigo.value = "";
    inputCodigo.focus();
  });

  // ---------- dashboard ----------

  function mostrarDashboard() {
    document.getElementById("pantalla-login").classList.add("oculto");
    document.getElementById("pantalla-dashboard").classList.remove("oculto");
    document.getElementById("txt-propietario").textContent = estadoApp.propietario;
    renderizar();
    marcarActualizado();

    clearInterval(timerRefresh);
    clearInterval(timerTick);
    timerRefresh = setInterval(actualizarDatos, INTERVALO_REFRESH_MS);
    timerTick = setInterval(renderizar, INTERVALO_TICK_MS);
  }

  function marcarActualizado() {
    const ahora = new Date();
    document.getElementById("txt-ultima-actualizacion").textContent =
      `Actualizado ${dosDigitos(ahora.getHours())}:${dosDigitos(ahora.getMinutes())}:${dosDigitos(ahora.getSeconds())}`;
  }

  function actualizarDatos() {
    if (!estadoApp.propietario) return;
    return getAppsScript({ action: "export" })
      .then(resp => {
        if (!resp.ok) return;
        estadoApp.perfiles = (resp.perfiles || []).filter(p => p.propietario === estadoApp.propietario);
        renderizar();
        marcarActualizado();
      })
      .catch(() => { /* se mantiene lo último cargado si falla la red */ });
  }

  document.getElementById("btn-actualizar").addEventListener("click", () => {
    const btn = document.getElementById("btn-actualizar");
    btn.disabled = true;
    actualizarDatos().finally(() => { btn.disabled = false; });
  });

  function solicitarPausa(idJuego, nuevaAccion, estadoOptimista) {
    const perfil = estadoApp.perfiles.find(p => String(p.id_juego) === String(idJuego));
    if (perfil) {
      perfil.estado = estadoOptimista;
      renderizar();
    }
    postAppsScript({
      action: "solicitar_pausa",
      propietario: estadoApp.propietario,
      codigo: estadoApp.codigo,
      id_juego: idJuego,
      nueva_accion: nuevaAccion,
    }).then(resp => {
      if (!resp.ok && perfil) {
        alert(resp.error || "No se pudo enviar la solicitud, intenta de nuevo.");
        actualizarDatos();
      }
    }).catch(() => {
      alert("No se pudo conectar para enviar la solicitud.");
    });
  }

  // ---------- render ----------

  function renderizar() {
    renderTotalesGlobales();
    renderCuentas();
  }

  function renderTotalesGlobales() {
    const p = estadoApp.perfiles;
    const totales = p.reduce((acc, x) => {
      acc.alimento += numero(x.alimento_actual);
      acc.madera += numero(x.madera_actual);
      acc.piedra += numero(x.piedra_actual);
      acc.oro += numero(x.oro_actual);
      return acc;
    }, { alimento: 0, madera: 0, piedra: 0, oro: 0 });

    const activos = p.filter(x => (x.estado || "activo") === "activo").length;
    const pausados = p.filter(x => x.estado === "pausado").length;
    const pendientes = p.filter(x => x.estado === "pausar_solicitado" || x.estado === "reanudar_solicitado").length;

    document.getElementById("totales-globales").innerHTML = `
      <div class="stat-tile"><div class="valor">🌾 ${formatoNumero(totales.alimento)}</div><div class="etiqueta">Alimento</div></div>
      <div class="stat-tile"><div class="valor">🪵 ${formatoNumero(totales.madera)}</div><div class="etiqueta">Madera</div></div>
      <div class="stat-tile"><div class="valor">🪨 ${formatoNumero(totales.piedra)}</div><div class="etiqueta">Piedra</div></div>
      <div class="stat-tile"><div class="valor">🪙 ${formatoNumero(totales.oro)}</div><div class="etiqueta">Oro</div></div>
    `;

    document.getElementById("resumen-estado").innerHTML = `
      <span><b>${p.length}</b> perfiles</span>
      <span><b>${activos}</b> activos</span>
      <span><b>${pausados}</b> pausados</span>
      ${pendientes ? `<span><b>${pendientes}</b> aplicando cambios…</span>` : ""}
    `;
  }

  function renderCuentas() {
    const cont = document.getElementById("contenedor-cuentas");

    if (!estadoApp.perfiles.length) {
      cont.innerHTML = `<div class="vacio">No se encontraron perfiles asociados a este código.</div>`;
      return;
    }

    const porCuenta = {};
    estadoApp.perfiles.forEach(p => {
      const key = p.email_cuenta || "sin_cuenta";
      (porCuenta[key] = porCuenta[key] || []).push(p);
    });

    cont.innerHTML = Object.keys(porCuenta).sort().map(email => {
      const perfiles = porCuenta[email].sort((a, b) => (a.numero_perfil || 0) - (b.numero_perfil || 0));
      const sub = perfiles.reduce((acc, x) => {
        acc.alimento += numero(x.alimento_actual);
        acc.madera += numero(x.madera_actual);
        acc.piedra += numero(x.piedra_actual);
        acc.oro += numero(x.oro_actual);
        return acc;
      }, { alimento: 0, madera: 0, piedra: 0, oro: 0 });

      return `
        <div class="grupo-cuenta">
          <div class="cabecera">
            <div class="email">${escapeHtml(email)}</div>
            <div class="subtotales">
              <span>🌾 <b>${formatoNumero(sub.alimento)}</b></span>
              <span>🪵 <b>${formatoNumero(sub.madera)}</b></span>
              <span>🪨 <b>${formatoNumero(sub.piedra)}</b></span>
              <span>🪙 <b>${formatoNumero(sub.oro)}</b></span>
            </div>
          </div>
          <div class="lista-perfiles">
            ${perfiles.map(renderPerfilCard).join("")}
          </div>
        </div>
      `;
    }).join("");
  }

  function renderPerfilCard(p) {
    const est = infoEstado(p.estado || "activo");
    const regreso = textoRegreso(p);

    return `
      <div class="perfil-card">
        <div class="perfil-id">
          <div class="nombre">${escapeHtml(p.nombre || "(sin nombre)")}</div>
          <div class="meta">Perfil ${escapeHtml(p.numero_perfil ?? "?")} · Ayuntamiento ${escapeHtml(p.ayuntamiento ?? "?")} · ID ${escapeHtml(p.id_juego)}</div>
        </div>

        <div class="recursos">
          <span class="chip">🌾 ${formatoNumero(numero(p.alimento_actual))}</span>
          <span class="chip">🪵 ${formatoNumero(numero(p.madera_actual))}</span>
          <span class="chip">🪨 ${formatoNumero(numero(p.piedra_actual))}</span>
          <span class="chip">🪙 ${formatoNumero(numero(p.oro_actual))}</span>
        </div>

        <div class="tiempos">
          <div>Última granja: ${escapeHtml(p.ultimo_farmer || "—")}</div>
          <div class="${regreso.clase}">${regreso.texto}</div>
        </div>

        <div class="acciones-perfil">
          <span class="badge ${est.badge}">${est.label}</span>
          <button
            class="btn btn-sm ${est.claseBtn}"
            ${est.habilitado ? "" : "disabled"}
            data-id="${escapeHtml(p.id_juego)}"
            data-accion="${est.accion || ""}"
            ${est.habilitado ? `onclick="window.__pausarPerfil('${escapeAttr(p.id_juego)}','${est.accion}')"` : ""}
          >${est.boton}</button>
        </div>
      </div>
    `;
  }

  window.__pausarPerfil = function (idJuego, accion) {
    const estadoOptimista = accion === "reanudar" ? "reanudar_solicitado" : "pausar_solicitado";
    solicitarPausa(idJuego, accion, estadoOptimista);
  };

  function escapeHtml(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
  function escapeAttr(v) { return escapeHtml(v).replace(/'/g, "\\'"); }

  // ---------- sesión persistida ----------

  const codigoGuardado = sessionStorage.getItem("farmeo_codigo");
  if (codigoGuardado) {
    inputCodigo.value = codigoGuardado;
    intentarLogin(codigoGuardado);
  } else {
    inputCodigo.focus();
  }
})();
</script>
